name: Secure Pipeline ML

on:
  pull_request:
    branches:
      - test

jobs:

  security_review:
    name: Análisis de Seguridad con IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # ← NECESARIO para git diff

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security Scan (ML)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: python ci_security_scan.py


  run_tests:
    name: Pruebas Unitarias
    needs: security_review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # ← TAMBIÉN AQUÍ

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PyTest
        run: pytest


  deploy:
    name: Despliegue Automático
    needs: run_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # ← TAMBIÉN AQUÍ

      - name: Deploy to Railway
        run: railway up --service secure-app
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notificar despliegue
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage?chat_id=${{ secrets.TG_CHAT }}&text=✔ Deploy realizado correctamente 🚀"
