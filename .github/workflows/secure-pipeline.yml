name: Secure Pipeline ML

on:
  pull_request:
    branches:
      - test   # Cada PR hacia test activa TODA la pipeline

jobs:

  ###########################################################
  # JOB 1 — ANÁLISIS DE SEGURIDAD (IA + ML)
  ###########################################################
  security_review:
    name: Análisis de Seguridad con IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # NECESARIO para git diff

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security Scan (ML)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: python ci_security_scan.py


  ###########################################################
  # JOB 2 — PRUEBAS UNITARIAS (Solo si seguridad pasa)
  ###########################################################
  run_tests:
    name: Pruebas Unitarias
    needs: security_review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # IMPORTANTE: Sin esto pytest NO puede importar src.app
      - name: Fix PYTHONPATH for GitHub Actions
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run PyTest
        run: pytest


  ###########################################################
  # JOB 3 — DESPLIEGUE AUTOMÁTICO (solo si pruebas pasan)
  ###########################################################
  deploy:
    name: Despliegue Automático
    needs: run_tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          railway link
          railway up --detach

      - name: Notificar despliegue
        if: success()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage?chat_id=${{ secrets.TG_CHAT }}&text=✔ Deploy realizado correctamente 🚀"
      
      - name: Notificar error en deploy
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage?chat_id=${{ secrets.TG_CHAT }}&text=❌ Error en el deploy"
