name: Secure Pipeline ML

on:
  pull_request:
    branches:
      - test   # Cada PR hacia test activa TODA la pipeline

jobs:

  ###########################################################
  # JOB 1 — ANÁLISIS DE SEGURIDAD (IA + ML)
  ###########################################################
  security_review:
    name: Análisis de Seguridad con IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # NECESARIO para git diff

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security Scan (ML)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: python ci_security_scan.py


  ###########################################################
  # JOB 2 — PRUEBAS UNITARIAS (Solo si seguridad pasa)
  ###########################################################
  run_tests:
    name: Pruebas Unitarias
    needs: security_review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # IMPORTANTE: Sin esto pytest NO puede importar src.app
      - name: Fix PYTHONPATH for GitHub Actions
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run PyTest
        run: pytest


  ###########################################################
  # JOB 3 — DESPLIEGUE AUTOMÁTICO (solo si pruebas pasan)
  ###########################################################
  deploy:
    name: Despliegue Automático
    needs: run_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Trigger Railway Deploy
        run: |
          curl --request POST \
            --url https://backboard.railway.app/graphql/v2 \
            --header "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"query":"mutation { deploymentTrigger(input: { projectId: \"5b873fe4-d8f7-40b6-9a13-f786a1a51153\", environmentId: \"production\" }) { id } }"}'

      - name: Notificar despliegue
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TG_TOKEN }}" ] && [ -n "${{ secrets.TG_CHAT }}" ]; then
            curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage?chat_id=${{ secrets.TG_CHAT }}&text=✅ Deploy iniciado en Railway 🚀"
          fi
      
      - name: Notificar error en deploy
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TG_TOKEN }}" ] && [ -n "${{ secrets.TG_CHAT }}" ]; then
            curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage?chat_id=${{ secrets.TG_CHAT }}&text=❌ Error al iniciar el deploy"
          fi
